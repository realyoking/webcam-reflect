<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frosted Blue Glass UI</title>
    <style>
        body {
            margin: 0;
            /* Deep space blue background gradient */
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            overflow: hidden;
            perspective: 1000px; /* For slight 3D effect on the card */
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        /* --- Glassy Pill Button --- */
        .glass-button {
            position: relative;
            padding: 24px 80px;
            border-radius: 999px;
            /* Deep frosted blue glass base */
            background: rgba(56, 189, 248, 0.08); 
            border: 1px solid rgba(56, 189, 248, 0.3);
            /* The core blue blur effect */
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.3), /* Outer shadow */
                inset 0 2px 6px rgba(255,255,255,0.1); /* Inner highlight */
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
            font-size: 24px;
            /* Metallic Chrome Text Effect */
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(180deg, #ffffff 0%, #a5f3fc 50%, #06b6d4 100%);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .glass-button:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.2);
        }

        /* --- Glassy Text Card --- */
        .glass-card {
            position: relative;
            padding: 60px;
            border-radius: 24px;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transform: rotateX(5deg) rotateY(-5deg); /* Slight 3D tilt */
            transition: transform 0.4s ease;
        }

        .glass-card:hover {
            transform: rotateX(0deg) rotateY(0deg);
        }

        .underworld-text {
            font-size: 120px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            /* The gradient for the "Underworld" text */
            background-image: linear-gradient(
                180deg, 
                #ffffff 0%, 
                #e0f2fe 20%, 
                #7dd3fc 50%, 
                #0ea5e9 80%, 
                #0284c7 100%
            );
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 15px rgba(14, 165, 233, 0.5));
        }

        /* --- Aura Tag --- */
        .aura-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            color: #888;
            font-weight: 500;
            text-transform: lowercase;
        }

        .aura-tag svg {
            color: #38bdf8;
            filter: drop-shadow(0 0 5px #38bdf8);
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Style 1: The Static Glass Pill Button -->
        <button class="glass-button">
            Button
        </button>

        <!-- Style 2: The Static Glassy Text Card -->
        <div class="glass-card">
            <h1 class="underworld-text">Underworld</h1>
        </div>

        <div class="aura-tag">
            <!-- SVG Icon instead of emoji -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
            <span>static glass aura locked</span>
        </div>
    </div>

</body>
</html>
