<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Permission Glass Popup</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #090d16 0%, #172033 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* The Glass Popup Box */
        .permission-modal {
            position: relative;
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(14, 165, 233, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.7),
                inset 0 1px 3px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: floatUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .camera-icon-box {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .modal-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-block {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-block:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-allow {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        .btn-allow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
        }
    </style>
</head>
<body>

    <div class="permission-modal">
        <div class="modal-header">
            <div class="camera-icon-box">
                <!-- SVG Icon instead of emoji -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </div>
            <div class="modal-title">Allow Camera Access?</div>
        </div>
        <p class="modal-desc">
            localhost wants to use your camera for real-time chrome glass reflection mapping.
        </p>
        <div class="modal-buttons">
            <button class="btn btn-block">Block</button>
            <button class="btn btn-allow">Allow</button>
        </div>
    </div>

</body>
</html>
