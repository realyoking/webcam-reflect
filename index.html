<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld Liquid Chrome</title>
    <style>
        body {
            margin: 0;
            background: #050508;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* The Liquid Chrome Pill Button */
        .chrome-button {
            position: relative;
            padding: 22px 70px;
            border-radius: 999px;
            background: linear-gradient(135deg, #2a2b36 0%, #111216 50%, #000000 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            overflow: hidden;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.8),
                inset 0 1px 2px rgba(255,255,255,0.4),
                inset 0 -2px 5px rgba(0,0,0,0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chrome-button:hover {
            transform: scale(1.05);
        }

        /* Moving shiny reflection overlay that tracks mouse */
        .chrome-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.4) 0%, transparent 50%);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .button-text {
            position: relative;
            z-index: 2;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            /* Chrome Metallic Text Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #888c9a 40%, #2b2e38 50%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9));
        }

        /* Underworld Gothic Typography */
        .underworld-title {
            font-size: 90px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a5b2 50%, #434756 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9)) drop-shadow(0 0 40px rgba(255,255,255,0.1));
        }

        .aura-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Liquid Chrome Button -->
        <button class="chrome-button" id="liquidBtn">
            <span class="button-text">Button</span>
        </button>

        <!-- Underworld Title -->
        <h1 class="underworld-title">Underworld</h1>

        <div class="aura-tag">
            <!-- SVG Icon instead of emoji -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
            <span>Aura T Gang • Liquid Specular Shading</span>
        </div>
    </div>

    <script>
        // Track mouse to move the liquid chrome specular highlight across the button
        const btn = document.getElementById('liquidBtn');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            btn.style.setProperty('--x', `${x}%`);
            btn.style.setProperty('--y', `${y}%`);
        });
    </script>
</body>
</html>
